<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" fill="#F2EFE6"/>
  <g transform="translate(50, 50) scale(0.9) translate(-50, -50)">
      <!-- Crust background -->
      <polygon points="50,95 10,25 90,25" fill="#F2EFE6" stroke="#D42B1F" stroke-width="4" stroke-linejoin="round"/>
      <!-- Crust top edge -->
      <path d="M 5 25 Q 50 5 95 25" fill="none" stroke="#D42B1F" stroke-width="10" stroke-linecap="round"/>
      
      <!-- Tomatoes -->
      <circle cx="50" cy="45" r="7" fill="#D42B1F"/>
      <circle cx="35" cy="65" r="5" fill="#D42B1F"/>
      <circle cx="65" cy="55" r="6" fill="#D42B1F"/>
      <circle cx="48" cy="78" r="4" fill="#D42B1F"/>
      
      <!-- Cream Highlights on Tomatoes -->
      <circle cx="52" cy="43" r="1.5" fill="#F2EFE6"/>
      <circle cx="36" cy="63" r="1" fill="#F2EFE6"/>
      <circle cx="67" cy="53" r="1.5" fill="#F2EFE6"/>
      
      <!-- Basil Leaves (Sage Green) -->
      <path d="M 35 35 Q 45 30 50 40 Q 40 45 35 35 Z" fill="#B9CBB0"/>
      <path d="M 75 40 Q 65 35 60 45 Q 70 50 75 40 Z" fill="#B9CBB0"/>
      <path d="M 50 60 Q 60 65 55 75 Q 45 70 50 60 Z" fill="#B9CBB0"/>
